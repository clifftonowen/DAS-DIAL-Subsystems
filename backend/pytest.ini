[pytest]
# Run from the backend/ directory so `from app.main import app` resolves.
pythonpath = .
testpaths = tests

# Test-pyramid markers. Select a level with e.g. `pytest -m unit`.
# `-m "unit or integration"` runs the fast, hermetic levels (no secrets, no DB).
markers =
    unit: isolated single-unit tests, all collaborators mocked (fast, no I/O)
    integration: bottom-up call-graph tests; only the Supabase driver is faked
    e2e: full-stack use-case flows against the real Supabase test project (needs secrets)
    system: Selenium browser tests driving the built UI (needs Chrome + a running stack)

# Fail on unregistered markers so typos surface early.
addopts = --strict-markers
