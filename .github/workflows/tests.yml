# Test pipeline for DAS D.I.A.L — runs the whole test pyramid on every push/PR.
#
# Levels & gating:
#   backend-unit / backend-integration          -> always run, no secrets
#   frontend-unit / frontend-integration        -> always run, no secrets
#   backend-e2e -> system -> frontend-e2e       -> need the test project, and run in that
#                                                  order: they share one Supabase project
#
#   backend-e2e   pytest + httpx over HTTP, no browser
#   system        Selenium, real browser, driven from the backend suite
#   frontend-e2e  Playwright, real browser, driven from the frontend package
#
# Required repository Secrets (Settings -> Secrets and variables -> Actions) for the three
# secret-backed jobs. Without them those jobs still succeed — every test self-skips (see
# backend/tests/conftest.py and frontend/e2e/login.spec.js) — so forks and unconfigured
# repos stay green. A green job may therefore have run NOTHING; read the skip list:
#   SUPABASE_URL              service-role URL of the Supabase TEST project
#   SUPABASE_KEY              service-role key (backend)
#   SUPABASE_JWT_SECRET       JWT secret of the test project
#   SUPABASE_ANON_KEY         anon key (frontend build)
#   TEST_THERAPIST_EMAIL      a seeded therapist user in the test project
#   TEST_THERAPIST_PASSWORD   that user's password
#   TEST_LEARNER_ID           a learner id from infra/seed.sql, for UC2's backend-e2e test
#                             and UC4's disposable review activity in the browser tiers.
#                             Seed the project first: the learner must exist (FK on
#                             learner_sittings.learner_id) AND have at least one sitting,
#                             or generate_profile correctly returns 409 "no scores on
#                             record" and the test's assert 200 fails. seed.sql gives all
#                             ten seeded learners three sittings each, so any of them works.
#   TEST_UNSCORED_LEARNER_ID  a learner with NO rows in learner_sittings. Drives the refusal
#                             branches — UC2's ST-2.2 (409 -> upload prompt) and UC3's ST-3.2
#                             (refused before the LLM, so no model needed). seed.sql's learners
#                             all HAVE sittings, so this one has to be added by hand.
#   TEST_SHARE_LEARNER_ID     a learner who already has a generated learning activity. UC7's
#                             "Share" button is disabled without one, and UC4's review box only
#                             renders under an activity.
#
# THE LAST TWO ARE NEW AND WERE PREVIOUSLY PASSED TO NO JOB AT ALL, which meant every UC7
# browser test and both refusal branches self-skipped on every run while the jobs reported
# success. They are now wired into `system` and `frontend-e2e`. Unset, those tests still skip
# rather than fail — so read the annotations, not just the tick.
#
# Test-project settings that are NOT secrets but the three secret-backed tiers depend on:
#   Authentication -> Providers -> Email -> "Confirm email" must be OFF. With it on,
#   sign-up issues no session (so UC8's log-in half skips) and every attempt sends an
#   email, which exhausts the default 2/hour quota and fails the sign-up outright.
name: tests

# Scoped to main + PRs rather than a bare `push:`. A bare push trigger ran a SECOND, identical
# workflow for every push to a branch that already had a PR open — and the two runs' `system` jobs
# then drove the same Supabase test project at the same time. See the concurrency note on the
# backend-e2e job below for what that collision actually broke.
#
# Trade-off, deliberately accepted: a branch gets no CI until a PR is open for it.
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. The frontend's three VITE_* values are inlined at BUILD time, so changing one
  # of them changes nothing until a build runs — and with no code change to push, there would
  # otherwise be no way to rebuild. That is not hypothetical: the first deployment shipped a
  # bundle pointing at the wrong Supabase project, and repointing the secret could not fix it
  # without this.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- unit (be)
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # infra/schema.sql is what a human pastes into the SQL editor for a fresh hosted project;
      # supabase/migrations/ is what the CLI applies for the e2e tiers. Both must exist, so one is
      # a copy — and if they drift, CI passes against a schema production does not have, which is
      # the kind of green build that is worse than a red one. Cheapest possible guard.
      - name: Schema files match
        working-directory: .
        run: |
          # `tr -d '\r'` on both sides: this repo is developed on Windows and the two files can
          # legitimately be checked out with different line endings, which a byte-diff would
          # report as every line changed. Only the SQL matters here.
          if ! diff <(tail -n +12 supabase/migrations/20260101000000_schema.sql | tr -d '\r') <(tr -d '\r' < infra/schema.sql); then
            echo "::error::supabase/migrations/20260101000000_schema.sql has drifted from infra/schema.sql."
            echo "Fix with: cp infra/schema.sql supabase/migrations/20260101000000_schema.sql"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -m unit --cov=app --cov-report=term-missing

  # --------------------------------------------------------- integration (be)
  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -m integration

  # ---------------------------------------------------------------- unit (fe)
  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Unit only. These two tiers used to run together under `npm test`, which left the
      # frontend's integration level invisible in the job list even though it was executing.
      - run: npm run test:unit

  # --------------------------------------------------------- integration (fe)
  # Jest + MSW: the view/component is real, `lib/api.js` is real, and only the network is
  # replaced. Hermetic — no secrets, no browser, no backend — so it runs beside the unit tiers
  # rather than behind them. See frontend/src/views/__integration__/README.md.
  frontend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  # ---------------------------------------------------------------- e2e (be)
  # HTTP-level end-to-end: pytest + httpx against a real backend and a real Supabase test
  # project. No browser — that is `system` (Selenium) and `frontend-e2e` (Playwright).
  #
  # Named `backend-e2e`, not `e2e`, so the rendered job graph reads as a pyramid. As plain
  # "e2e" beside frontend-unit and frontend-integration it looked like the e2e tier for the
  # whole repo, and the arrows into `system` and `frontend-e2e` read as though the FRONTEND
  # tiers were gating the backend's e2e run. They never were.
  #
  # Gated on both backend levels: don't spend a secret-backed run until the cheap hermetic
  # backend tiers pass.
  backend-e2e:
    needs: [backend-unit, backend-integration]
    runs-on: ubuntu-latest
    # NO `concurrency` GROUP ANY MORE, and that is the point of the change.
    #
    # This tier and the two below it used to serialise across every run of the repo, because they
    # shared one mutable Supabase test project and a single TEST_LEARNER_ID inside it. What
    # overlapping runs broke (PR #23): `uc4_activity` inserted one activity per run for that
    # learner, LearnerDetailPage renders the NEWEST activity, so each run's browser could be
    # looking at the other run's row — UC4's delete-then-expect-a-rejected-write test deleted its
    # own activity while the page showed the other's, the write succeeded, and the test timed out
    # waiting for an error that was never coming.
    #
    # `supabase start` gives each run its own database, so there is no shared resource left to
    # collide on and the three heaviest jobs stop queueing behind one another. It also removes the
    # hosted test project entirely, which is what freed a slot on the 2-project free plan.
    defaults:
      run:
        working-directory: backend
    # Literals, not secrets. The Supabase CLI's local stack always issues these same demo keys —
    # they are published in its docs, grant nothing beyond a throwaway container, and being fixed
    # is the whole reason the TEST_* ids below can be constants too.
    #
    # Those ids were previously five GitHub secrets, two of which were never set, which is why the
    # browser tiers could not run at all. They now come from infra/seed.sql + supabase/seed_ci.sql,
    # which rebuild from scratch every run, so they cannot drift and cannot go missing.
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      TEST_THERAPIST_EMAIL: ci-therapist@example.com
      TEST_THERAPIST_PASSWORD: ci-test-password-123
      # Has three sittings, so "Generate Profile" has a newest one to promote (200, not 409).
      TEST_LEARNER_ID: 11111111-1111-1111-1111-111111111111
      # UC2's alt flow 2a: no sittings at all, so generate-profile refuses with 409.
      TEST_UNSCORED_LEARNER_ID: bbbbbbbb-0000-4000-8000-000000000002
      # UC7/UC4: a learner who already owns a generated activity, and that activity's id. The
      # activity id was never wired up before, so all six UC7 share tests skipped in every run.
      TEST_SHARE_LEARNER_ID: 11111111-1111-1111-1111-111111111111
      TEST_ACTIVITY_ID: cccccccc-0000-4000-8000-000000000003
      # The app never reaches an LLM in this tier, but Settings.verify refuses to boot when the
      # embedding provider and the vector column disagree, so pin the pair explicitly.
      EMBEDDING_PROVIDER: ollama
      USE_EMBEDDING_ALT: "false"
      SIGNUP_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Runs at the repo root, not backend/ — config.toml and the migrations live in supabase/.
      - name: Start local Supabase
        working-directory: .
        run: supabase start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # -rs still prints the skip reasons. Nothing should skip now; if something does, that is a
      # fixture that went missing rather than an unconfigured checkout.
      - run: pytest -m e2e -rs

  # ------------------------------------------------------------------- system
  system:
    # Both frontend hermetic tiers, because this drives the built frontend in a browser — no
    # reason to spend a browser run while a Jest test is already red. Then backend-e2e, which
    # also puts the three secret-backed jobs in a strict chain: see the concurrency note below.
    needs: [frontend-unit, frontend-integration, backend-e2e]
    runs-on: ubuntu-latest
    # No concurrency group: `supabase start` gives this run its own database. See backend-e2e.
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      TEST_THERAPIST_EMAIL: ci-therapist@example.com
      TEST_THERAPIST_PASSWORD: ci-test-password-123
      # Seeded fixtures, not secrets. UC2's ST-2.2, UC3's ST-3.2 and all of UC7 used to self-skip
      # here because two of these were never set as secrets and the job still reported success.
      TEST_LEARNER_ID: 11111111-1111-1111-1111-111111111111
      TEST_UNSCORED_LEARNER_ID: bbbbbbbb-0000-4000-8000-000000000002
      TEST_SHARE_LEARNER_ID: 11111111-1111-1111-1111-111111111111
      TEST_ACTIVITY_ID: cccccccc-0000-4000-8000-000000000003
      EMBEDDING_PROVIDER: ollama
      USE_EMBEDDING_ALT: "false"
      SIGNUP_ENABLED: "true"
      FRONTEND_URL: http://127.0.0.1:4173
      SYSTEM_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: browser-actions/setup-chrome@v1

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start backend (uvicorn)
        working-directory: backend
        env:
          # The browser loads the app from FRONTEND_URL and calls this API
          # cross-origin, so that exact origin must be allowed — log-in goes through
          # AuthController now, so a missing origin fails authentication with
          # "Failed to fetch" rather than an HTTP error. Set explicitly rather than
          # relying on the default in app/core/config.py.
          CORS_ORIGINS: http://127.0.0.1:4173
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 1
          done

      - name: Build & serve frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
          # The local stack's fixed anon key, matching SUPABASE_URL above. The browser needs the
          # SAME project the API is talking to: the UI holds its session in the Supabase client,
          # so pointing it at a different project logs the user out mid-test.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break || sleep 1
          done

      - name: Run system (Selenium) tests
        working-directory: backend
        run: pytest -m system -rs

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-screenshots
          path: test-artifacts/
          if-no-files-found: ignore

      # THE SCREENSHOT SHOWS THE SYMPTOM, THIS SHOWS THE CAUSE. A browser test fails as a blank
      # dropdown or a stuck spinner, which is the same picture whether the API 500'd, timed out, or
      # was never called. Without the server's own log there is nothing to tell those apart after
      # the runner is gone, and the whole job has to be re-run blind to learn anything.
      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-backend-log
          path: backend/backend.log
          if-no-files-found: ignore

  # ------------------------------------------------------------- frontend-e2e
  # Playwright against the real built UI. Same pyramid level as `system` (a browser driving a
  # running app), so it gates on the same hermetic tiers and shares the Supabase group.
  #
  # WHY IT WAITS FOR `system` RATHER THAN RUNNING BESIDE IT. Not a real dependency — it is the
  # shared Supabase project again. GitHub allows one RUNNING and one PENDING job per concurrency
  # group and CANCELS anything queued behind those. With system and frontend-e2e both ready at
  # once, a single run puts two jobs in the group; a second concurrent run makes four, and jobs
  # start getting cancelled rather than queued. Chaining them
  # (backend-e2e -> system -> frontend-e2e) means each run only ever wants the group once.
  # The cost is wall-clock on a tier that is already the slowest; the benefit is that a busy
  # afternoon does not silently drop browser coverage.
  frontend-e2e:
    needs: [frontend-unit, frontend-integration, system]
    runs-on: ubuntu-latest
    # No concurrency group: `supabase start` gives this run its own database. See backend-e2e.
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      TEST_THERAPIST_EMAIL: ci-therapist@example.com
      TEST_THERAPIST_PASSWORD: ci-test-password-123
      # Seeded fixtures. These three used to gate UC2, UC3, UC4 and UC7 individually, and two were
      # never set — so those specs skipped while the "no browser tests ran" guard below stayed
      # green on the handful that did run. The tier now covers what its name suggests.
      #   TEST_LEARNER_ID           a learner WITH DIAL marks           (UC2, UC3)
      #   TEST_UNSCORED_LEARNER_ID  a learner with NO DIAL marks        (UC2, UC3)
      #   TEST_SHARE_LEARNER_ID     a learner with a generated activity (UC4, UC7)
      TEST_LEARNER_ID: 11111111-1111-1111-1111-111111111111
      TEST_UNSCORED_LEARNER_ID: bbbbbbbb-0000-4000-8000-000000000002
      TEST_SHARE_LEARNER_ID: 11111111-1111-1111-1111-111111111111
      TEST_ACTIVITY_ID: cccccccc-0000-4000-8000-000000000003
      EMBEDDING_PROVIDER: ollama
      USE_EMBEDDING_ALT: "false"
      SIGNUP_ENABLED: "true"
      FRONTEND_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start backend (uvicorn)
        working-directory: backend
        env:
          # SUPABASE_* deliberately NOT repeated here. They are set at job level, pointing at the
          # local stack; a step-level copy would override those with the production secrets and
          # this tier would drive a browser against the live project.
          #
          # The browser loads the app from FRONTEND_URL and calls this API cross-origin, so that
          # exact origin must be allowed or log-in fails with "Failed to fetch" rather than an
          # HTTP error. Same reasoning as the `system` job.
          CORS_ORIGINS: http://127.0.0.1:4173
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 1
          done

      - name: Build & serve frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
          # The local stack's fixed anon key, matching SUPABASE_URL above. The browser needs the
          # SAME project the API is talking to: the UI holds its session in the Supabase client,
          # so pointing it at a different project logs the user out mid-test.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run preview -- --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break || sleep 1
          done

      # The specs self-skip without the therapist credentials, so an unconfigured repo stays
      # green — the step below turns "everything skipped" into a failure rather than a pass.
      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      # `playwright test` EXITS 0 WHEN EVERY SPEC IS SKIPPED. That is how this job spent its early
      # life reporting green while running two specs out of nine — the rest were `describe.skip`
      # placeholders, which skip unconditionally, secrets or no secrets. A browser tier that tests
      # nothing has to be loud about it, so read the JSON reporter's stats and fail on zero.
      - name: Fail if no browser tests actually ran
        working-directory: frontend
        run: |
          node -e '
            const report = require("./playwright-results.json");
            const { stats } = report;
            const ran = stats.expected + stats.unexpected + stats.flaky;
            console.log(`ran=${ran} skipped=${stats.skipped}`);

            // Per-spec, because the totals hide the shape that actually bites: with the learner-id
            // secrets unset, login/sign-up/upload/view-learners still run, so `ran > 0` and the job
            // goes green while UC2, UC3, UC4 and UC7 never execute. Annotate those rather than fail
            // — an unset secret is a configuration choice, and only a wholly dead tier is an error.
            const skippedFiles = (report.suites ?? [])
              .filter((s) => !JSON.stringify(s).includes(`"status":"expected"`))
              .map((s) => s.title);
            for (const f of skippedFiles) {
              console.log(`::warning::${f} ran no tests - its learner-id secret is probably unset`);
            }

            if (ran === 0) {
              console.error("::error::frontend-e2e executed 0 tests - every spec skipped. " +
                "Check the TEST_THERAPIST_* secrets, and check for describe.skip left in a spec.");
              process.exit(1);
            }
          '

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      # Same reasoning as the `system` job: the trace shows what the browser saw, this shows what
      # the API did. Playwright's own trace cannot distinguish a slow endpoint from a broken one.
      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-backend-log
          path: backend/backend.log
          if-no-files-found: ignore

  # ------------------------------------------------------------------ deploy
  # Deployment is a JOB HERE rather than either platform's own git integration, and that is the
  # whole point: DO App Platform and Cloudflare Pages both offer auto-deploy-on-push, and both
  # would ship a red build. `needs` on the two terminal test jobs is what makes this CD rather
  # than "push and hope".
  #
  # `system` and `frontend-e2e` are the leaves of the pyramid — needing them transitively needs
  # every job above them, so listing the other five would be noise.
  deploy:
    needs: [system, frontend-e2e]
    # Pushes to main only. Without the event check a PR merged from a fork's branch named `main`
    # could match on ref alone.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialise deploys. Two pushes in quick succession otherwise race, and the loser can land
    # AFTER the winner and quietly publish the older commit. cancel-in-progress stops the
    # superseded run instead of letting it finish.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    # id-token: write is required for OIDC login to Azure — without it azure/login fails with a
    # message that never mentions permissions. packages: write is for pushing to ghcr.
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      # --- backend: Azure Container Apps ------------------------------------------------------
      # Azure replaced DigitalOcean App Platform: DO wound down its Student Pack participation
      # and every credit expired 2026-08-01. Azure for Students needs no credit card, gives
      # $100/year, and renews while enrolled.
      #
      # The image goes to ghcr, not Azure Container Registry. ACR Basic is ~$5/month and would
      # burn the credit for nothing — this repo is public so ghcr is free, and the image holds no
      # secrets (.dockerignore excludes .env; everything sensitive arrives as a runtime env var
      # from the Container Apps secret store).
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit SHA, not `latest`. Container Apps creates a new revision only when the
      # image reference actually changes, so a moving `latest` tag would leave the old revision
      # serving and the deploy would look successful while changing nothing.
      - name: Build and push API image
        id: image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-api:${{ github.sha }}"
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

      # Federated credentials, so there is no client secret stored anywhere. Pinned to pushes on
      # main of this repo by the subject in infra/azure-bootstrap.sh.
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Only the image, CORS origin and the retrieval gate are set here. The four real secrets
      # stay in the Container Apps secret store, referenced by the env vars the bootstrap script
      # created — they are never passed through this workflow and cannot end up in a log.
      #
      # MIN_SIMILARITY=0.60 is a DELIBERATE LOOSENING for the public demo, not the calibrated
      # value. scripts/calibrate_gate.py derives 0.71 from the golden set, but that set is
      # hand-written natural queries, and production builds something much thinner — e.g.
      # "literacy activity targeting phonics 3.8/10". Measured across 9 seeded learners those
      # score 0.6666-0.7359, while the worst junk probe (junk_maths_lookalike) scores 0.6859.
      # The two distributions OVERLAP: two real learners score below that junk query, so no
      # threshold both admits every learner and refuses every probe.
      #
      # What each choice costs, measured:
      #   0.71  5/9 learners, 0/7 junk   (calibrated, but refuses nearly half the demo)
      #   0.70  7/9 learners, 0/7 junk   (strictly better than 0.71 — free)
      #   0.60  9/9 learners, 1/7 junk   (admits junk_maths_lookalike at 0.6859)
      #   0.50  9/9 learners, 5/7 junk   (the old default; unacceptable)
      #
      # 0.60 trades the one near-miss probe for every learner demoing cleanly. Blatant off-topic
      # queries (football 0.5388, medical 0.5292, recipe 0.4866) are still refused. THE REAL FIX
      # is the query builder — emit concept/stage language instead of a mark fraction — after
      # which this should be re-derived and tightened again.
      - name: Deploy API
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update \
              --name "${{ secrets.AZURE_CONTAINERAPP }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "${{ steps.image.outputs.ref }}" \
              --set-env-vars CORS_ORIGINS="${{ secrets.PROD_FRONTEND_URL }}" MIN_SIMILARITY=0.60 \
              -o none
            # The bootstrap creates the app on a public placeholder image that serves on 80,
            # because no ghcr image exists yet at that point. uvicorn listens on 8000, so ingress
            # has to move across the first time a real image lands. Idempotent, so it stays here
            # rather than being a one-off someone has to remember.
            az containerapp ingress update \
              --name "${{ secrets.AZURE_CONTAINERAPP }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --target-port 8000 \
              -o none

      # --- frontend: Cloudflare Pages --------------------------------------------------------
      # Built here rather than by Pages' own git integration for one reason: the three VITE_*
      # values are inlined at build time, so the build must happen somewhere that already knows
      # which environment it is for. Doing it in the gated job keeps that decision next to the
      # gate.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          # Must match an origin in the API's CORS_ORIGINS or login fails in the browser with a
          # bare "Failed to fetch" and no status for the UI to show.
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Public by design and safe to inline: row level security is what protects the data,
          # not the obscurity of this key.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Setting BOTH switches AuthView into demo mode: it shows these credentials and hides
          # the sign-up toggle, which matches SIGNUP_ENABLED=false on the API. Stored as repo
          # secrets for consistency with the rest of this block, but neither is really secret —
          # they are printed on the login page on purpose. Leave them unset and the login screen
          # behaves exactly as it does locally.
          VITE_DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        # vite.config.js fails the build if any of the three is empty, so a missing secret stops
        # here instead of publishing a bundle that cannot reach the API.
        run: |
          npm ci
          npm run build

      - name: Publish frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # dist/_redirects (from public/) ships with this and is what makes /learners/:id
          # survive a refresh.
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

      # Proves the rollout is actually serving, not merely that the platforms accepted it. A
      # deploy that reports success and answers 502 is the failure this catches.
      - name: Smoke test
        run: |
          set -euo pipefail
          echo "GET ${{ secrets.PROD_API_URL }}/health"
          body=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
                 "${{ secrets.PROD_API_URL }}/health")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
