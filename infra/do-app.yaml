# DigitalOcean App Platform spec for the API. Checked in so the deployment is reproducible
# rather than a set of dashboard clicks nobody can review.
#
# First time:   doctl apps create --spec infra/do-app.yaml
# After edits:  doctl apps update <APP_ID> --spec infra/do-app.yaml
#
# The APP_ID it prints is the DO_APP_ID secret the deploy job in .github/workflows/tests.yml
# uses. Routine code deploys go through that job — not through this file.

name: das-dial-api
# Singapore. Latency to the browser barely matters for a demo, but Supabase lives in a region
# and every request makes a round trip to it, so keep them close.
region: sgp

services:
  - name: api
    http_port: 8000
    instance_count: 1
    # 512MB. The app holds no model weights and no local vector store — embeddings and
    # generation are both HTTP calls to Gemini, and all state is in Supabase — so this is
    # sized for request concurrency, not for anything resident.
    instance_size_slug: basic-xxs

    source_dir: backend
    dockerfile_path: backend/Dockerfile

    github:
      repo: clifftonowen/DAS-DIAL-Subsystems
      branch: main
      # FALSE on purpose. Auto-deploy-on-push would ship commits whose tests failed; the deploy
      # job in tests.yml triggers this app only after `system` and `frontend-e2e` pass.
      deploy_on_push: false

    # App Platform's own probe. Independent of the Dockerfile HEALTHCHECK — that one is for a
    # plain `docker run`, this is what decides whether a rollout is promoted or rolled back.
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 20
      failure_threshold: 3

    envs:
      # --- secrets: set with `doctl apps update --spec` AFTER replacing these, or in the
      # dashboard. type: SECRET means App Platform encrypts them and never echoes them back.
      # Do NOT commit real values — this file is in a public repo.
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SUPABASE_KEY          # service-role; bypasses RLS, backend only
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: SUPABASE_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME

      # --- model configuration. These three move together: gemini query vectors are only
      # meaningful against the `embedding_alt` column, and the gate is per-model. The app
      # refuses to boot if the first two disagree (Settings.verify).
      - key: LLM_PROVIDER
        scope: RUN_TIME
        value: gemini
      - key: EMBEDDING_PROVIDER
        scope: RUN_TIME
        value: gemini
      - key: USE_EMBEDDING_ALT
        scope: RUN_TIME
        value: "true"
      # Derived, not guessed: scripts/calibrate_gate.py measured a clean 0.0409 gap for
      # gemini-embedding-001 on this corpus (lowest real 0.7268, highest junk 0.6859). Re-run it
      # if the embedding model or the corpus changes. Leaving this at the 0.50 default would
      # admit 5 of the 7 junk queries in the golden set.
      - key: MIN_SIMILARITY
        scope: RUN_TIME
        value: "0.71"

      # --- app. CORS_ORIGINS must list the deployed frontend origin exactly (scheme + host +
      # port) or login fails in the browser as "Failed to fetch" with no status to report.
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: https://REPLACE-ME.pages.dev
      # Public deployment: visitors use the seeded demo account rather than creating accounts
      # against a shared Gemini key.
      - key: SIGNUP_ENABLED
        scope: RUN_TIME
        value: "false"
